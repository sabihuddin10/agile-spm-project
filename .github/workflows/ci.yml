# Definition of Done gate: every push/PR must build, lint and pass the
# acceptance tests (one test file per route module, named after the user stories)
# and the frontend unit tests (one test file per app/component module).
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API — syntax check
        run: pnpm --dir server run lint

      - name: API — acceptance tests (US1.1–US10.6)
        run: pnpm --dir server test

      - name: API — database tests (relational tables on Postgres 16)
        run: pnpm --dir server test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Web — lint
        run: pnpm --dir frontend run lint

      - name: Web — unit tests
        run: pnpm --dir frontend run test

      - name: Web — type check
        run: pnpm --dir frontend exec tsc --noEmit

      - name: Web — production build
        run: pnpm --dir frontend run build
